<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>환율 정보</title>
    <link rel="stylesheet" href="/style/css/apitest.css?v=250825a">
</head>
<body>

    <h1 style="text-align:center;">환율 정보</h2>

    <div id="controls">
        <select id="currencySelect">
            <option value="">전체 통화</option>
        </select>
        <button id="refreshBtn">새로고침</button>
    </div>

    <table id="rateTable">
        <thead>
            <tr>
                <th>통화명</th>
                <th>통화 단위</th>
                <th>매매기준율</th>
                <th>현찰 살때(TTB)</th>
                <th>현찰 팔때(TTS)</th>
                <th>송금 보낼때(MTT)</th>
                <th>송금 받을때(MTB)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="/js/script.js?v=250825a"></script>
</body>
</html>
